<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarWidgets Privacy Policy has moved</title>
  <meta http-equiv="refresh" content="0; url=https://advenostudio-carwidgets.pages.dev/privacy">
  <link rel="canonical" href="https://advenostudio-carwidgets.pages.dev/privacy">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #182322; background: #f6f7f3; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 32px 22px; }
    main { width: min(100%, 640px); }
    .eyebrow { margin: 0 0 20px; color: #45605b; font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    h1 { margin: 0 0 20px; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; font-weight: 600; letter-spacing: -.025em; }
    p { max-width: 52ch; font-size: 17px; line-height: 1.65; }
    a { color: #0e5147; text-underline-offset: .22em; overflow-wrap: anywhere; }
    a:focus-visible { outline: 3px solid #0e5147; outline-offset: 6px; }
    .continue { display: inline-block; margin-top: 12px; font-weight: 600; }
    .address { margin-top: 12px; color: #45605b; font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">NEW WEBSITE</p>
    <h1>We have a new address.</h1>
    <p>This page redirects to our new website. If it does not open, follow the link below.</p>
    <a class="continue" href="https://advenostudio-carwidgets.pages.dev/privacy">Continue to CarWidgets Privacy Policy <span aria-hidden="true">↗</span></a>
    <p class="address">https://advenostudio-carwidgets.pages.dev/privacy</p>
  </main>
</body>
</html>
